services:
  # 1. Die Datenbank (PostgreSQL)
  housecontrol-db:
    image: postgres:17-bullseye
    container_name: housecontrol-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST_AUTH_METHOD: password
    ports:
      - "9980:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data

  # 2. Die Verwaltungsoberfläche (pgAdmin)
  # Offizielles dpage/pgadmin4-Image mit ARM64-Support (Multi-Arch seit v6.x).
  # elestio/pgadmin wurde entfernt — hatte keine zuverlässige ARM64-Unterstützung
  # und lieferte auf dem Pi leere Seiten (kaputte JS/CSS-Pfade unter QEMU-Emulation).
  # Volume-Hinweis: pgAdmin laeuft intern als UID 5050. Beim ersten Start legt Docker
  # das Verzeichnis pgadmin_data/ als root an. Falls die UI nach dem Start nicht laedt,
  # einmalig auf dem Pi ausfuehren:
  #   sudo chown -R 5050:5050 /mnt/ssd/docker/pv-logger/pgadmin_data
  pgadminconsole:
    image: dpage/pgadmin4:9
    platform: linux/arm64
    restart: unless-stopped
    container_name: pgadminconsole
    environment:
      PGADMIN_DEFAULT_EMAIL: ${ADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${ADMIN_PASSWORD}
      PGADMIN_LISTEN_PORT: 8080
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    ports:
      - "9081:8080"
    depends_on:
      - housecontrol-db
    volumes:
      - ./pgadmin_data:/var/lib/pgadmin
      - ./servers.json:/pgadmin4/servers.json:ro

  # 3. Das Workflow-Tool (n8n)
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - TZ=${TZ}
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_RUNNERS_ENABLED=true
      # Datenbank-Verbindung (intern zu housecontrol-db)
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=housecontrol-db
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=housecontrol-db
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      # WICHTIG: Hier steht jetzt deine feste Ngrok-Adresse
      - WEBHOOK_URL=https://finnegan-distorted-scenographically.ngrok-free.dev
      # NEU: Erlaubt Login über http://folzpi.local
      - N8N_SECURE_COOKIE=false
    volumes:
      - ./n8n_data:/home/node/.n8n
      - ./Testdaten:/Testdaten
    depends_on:
      - housecontrol-db
    restart: unless-stopped

  # 4. Der Ngrok Tunnel
  ngrok:
    image: ngrok/ngrok:latest
    container_name: ngrok
    restart: unless-stopped
    environment:
      # Token kommt aus der .env Datei
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    command:
      # Wir binden deine feste Domain an den n8n Container
      - "http"
      - "--domain=finnegan-distorted-scenographically.ngrok-free.dev"
      - "n8n:5678"
    ports:
      - "4040:4040" # Dashboard zur Kontrolle
    depends_on:
      - n8n